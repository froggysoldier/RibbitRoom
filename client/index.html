<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Chatroom</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    header {
      background: #333;
      color: white;
      padding: 10px;
      display: flex;
      align-items: center;
    }

    #loginBtn {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 5px;
    }

    #chatWindow {
      width: 70%;
      max-width: 800px;
      margin: 50px auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
    }

    #messageInput {
      width: calc(100% - 80px);
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #sendBtn {
      padding: 10px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #inputArea {
      width: 70%;
      max-width: 800px;
      margin: 10px auto;
      display: flex;
      gap: 10px;
    }

    /* Modal Styles */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1; 
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .modal-content input {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
    }

    .modal-content button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .close {
      float: right;
      cursor: pointer;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <button id="loginBtn">Login / Registrieren</button>
</header>

<div id="chatWindow">
  <p><strong>System:</strong> Willkommen im Chat!</p>
</div>

<div id="inputArea">
  <input type="text" id="messageInput" placeholder="Nachricht eingeben...">
  <button id="sendBtn">Senden</button>
</div>

<!-- Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Benutzername">
    <input type="password" id="password" placeholder="Passwort">
    <button id="loginSubmit">Einloggen</button>
    <hr>
    <h3>Oder registrieren</h3>
    <input type="text" id="newUser" placeholder="Benutzername">
    <input type="password" id="newPass" placeholder="Passwort">
    <input type="email" id="email" placeholder="E-Mail">
    <button id="registerSubmit">Registrieren</button>
  </div>
</div>

<script>
  const loginBtn = document.getElementById("loginBtn");
  const modal = document.getElementById("loginModal");
  const span = document.querySelector(".close");
  const chatWindow = document.getElementById("chatWindow");
  const sendBtn = document.getElementById("sendBtn");
  const messageInput = document.getElementById("messageInput");

  // Modal öffnen
  loginBtn.onclick = () => modal.style.display = "block";

  // Modal schließen
  span.onclick = () => modal.style.display = "none";
  window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

  // Nachricht senden
  sendBtn.onclick = () => {
    if (messageInput.value.trim() !== "") {
      let p = document.createElement("p");
      p.innerHTML = "<strong>Du:</strong> " + messageInput.value;
      chatWindow.appendChild(p);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      messageInput.value = "";
    }
  };
</script>

</body>
</html>
