<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Chatroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button id="loginBtn">Login / Registrieren</button>
</header>

<main>
  <div id="container">
    <!-- Sidebar für aktive Nutzer -->
    <div id="userList">
      <h3>Aktive Nutzer</h3>
      <ul id="users">
        <!-- Dynamisch gefüllte Nutzerliste -->
      </ul>
    </div>

    <!-- Chatbereich -->
    <div id="chatArea">
      <div id="chatWindow">
        <p><strong>System:</strong> Willkommen im Chat!</p>
      </div>

      <div id="inputArea">
        <input type="text" id="messageInput" placeholder="Nachricht eingeben...">
        <button id="sendBtn">Senden</button>
      </div>
    </div>
  </div>
</main>

<!-- Modal für Login/Register -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Benutzername">
    <input type="password" id="password" placeholder="Passwort">
    <button id="loginSubmit">Einloggen</button>
    <hr>
    <h3>Oder registrieren</h3>
    <input type="text" id="newUser" placeholder="Benutzername">
    <input type="password" id="newPass" placeholder="Passwort">
    <input type="email" id="email" placeholder="E-Mail">
    <button id="registerSubmit">Registrieren</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
