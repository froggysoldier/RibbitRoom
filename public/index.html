<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ribbit Room</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <button id="loginBtn">Login / Registrieren</button>
  <img src="images/logo.png" alt="Mein Logo" class="logo">
</header>
  
<main>
  <div id="container">
    <!-- Sidebar für aktive Nutzer -->
    <div id="userList">
      <h3><span class="highlight">Aktive Nutzer</span></h3>
      <ul id="users"></ul>
    </div>

    <!-- Chatbereich -->
    <div id="chatArea">
      <div id="chatWindow">
       <!-- <p><strong>System:</strong> Willkommen im Chat!</p> -->
      </div>

      <div id="inputArea">
        <textarea id="messageInput" placeholder="Nachricht eingeben..." rows="2"></textarea>
        <button id="sendBtn">Senden</button>
      </div>

      <!-- Filter Switch unter dem Input-Bereich -->
      <div id="filterContainer">
        <label class="switch">
          <input type="checkbox" id="filterBtn">
          <span class="slider"></span>
        </label>
        <span class="filterLabel">FroschFilter</span>
      </div>

    </div>
  </div>
</main>

<!-- Modal für Login/Register -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Benutzername">
    <input type="password" id="password" placeholder="Passwort">
    <button id="loginSubmit">Einloggen</button>
    <hr>
    <h3>Oder registrieren</h3>
    <input type="text" id="newUser" placeholder="Benutzername">
    <input type="password" id="newPass" placeholder="Passwort">
    <input type="email" id="email" placeholder="E-Mail">
    <button id="registerSubmit">Registrieren</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
