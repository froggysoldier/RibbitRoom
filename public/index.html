<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ribbit Room</title>
  <link rel="stylesheet" href="style.css">
     <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
        <link rel="manifest" href="images/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <button id="loginBtn">Login / Registrieren</button>
  <img src="images/logo.png" alt="Mein Logo" class="logo">
    <nav>
    <ul>
     <li> <a href="start.html">Startseite</a></li>
    <li> <a href="index.html">Chatroom</a></li>
    <li> <a href="Kontakt.html">Kontakt</a></li>
    <li> <a href="Impressum.html">Impressum</a></li>
     </ul> 
  </nav>
</header>
  
<main>
    <div id="container">
      <!-- Sidebar für aktive Nutzer -->
      <div id="userList">
        <h3><span class="highlight">Aktive Nutzer</span></h3>
        <ul id="users"></ul>
      </div>
  
      <!-- Chatbereich -->
      <div id="chatArea">
        <div id="chatWindow">
         <!--- <p><strong>System:</strong> Willkommen im Chat!</p>
          <p><strong>System:</strong> Erst Anmelden!</p> --->
        </div>
  
        <div id="inputArea">
          <textarea id="messageInput" placeholder="Nachricht eingeben..." rows="2"></textarea>
          <button id="sendBtn">Senden</button>
        </div>
  
        <!-- Filter Switch unter dem Input-Bereich -->
        <div id="filterContainer">
          <label class="switch">
            <input type="checkbox" id="filterBtn">
            <span class="slider round"></span>
          </label>
          <span class="filterLabel">🐸 RibbitFilter</span>
        </div>
  
  
      </div>
    </div>
</main>

<!-- Modal -->
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="close">&times;</span>

    <!-- LOGIN -->
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Benutzername">
    <input type="password" id="password" placeholder="Passwort">
    <button id="loginSubmit">Einloggen</button>

    <hr>

    <!-- REGISTRIERUNG -->
    <h3>Registrieren</h3>
    <input type="text" id="newUser" placeholder="Benutzername">
    <input type="password" id="newPass" placeholder="Passwort">
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="adminPass" placeholder="Admin-Passwort (optional)">
    <button id="registerSubmit">Registrieren</button>

    <!-- CODE-FELD (jetzt NUR für Registrierung) -->
    <div id="codeModal" style="display:none; margin-top:10px;">
      <h3>E-Mail bestätigen</h3>
      <input type="text" id="codeInput" placeholder="Bestätigungscode">
      <button id="codeSubmit">Code bestätigen</button>
    </div>
  </div>
</div>

<!-- Socket.IO client via CDN -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="" crossorigin="anonymous"></script>
<script type="module" src="/js/app.js"></script>

</body>
</html>
